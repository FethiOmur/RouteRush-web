<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- SELF-CONTAINED ON PURPOSE. The mask image is a data: URI, not a file
       reference. Browsers render a favicon SVG in SVG "secure static mode",
       which loads no external resources: an earlier version pointed the mask at
       favicon.png and the mask resolved to nothing, so the tab icon rendered
       empty — not the wrong colour, absent. Anything this file needs must be
       inline.

       The wordmark R is a brush glyph, so it is a mask rather than a traced
       path: a solid rect is painted through the glyph's alpha channel (a
       192px grayscale copy, ample for a 16-32px tab icon). That is what lets
       the colour follow the tab strip — a plain transparent PNG of a near-white
       mark disappears on a light tab strip. -->
  <defs>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <image href="data:image/png;base64," x="0" y="0" width="512" height="512"/>
    </mask>
    <style>
      .ink { fill: #111; }
      @media (prefers-color-scheme: dark) { .ink { fill: #fff; } }
    </style>
  </defs>
  <rect class="ink" x="0" y="0" width="512" height="512" mask="url(#m)"/>
</svg>
